version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    groups:
      react-runtime:
        patterns:
          - react
          - react-dom
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /doc-parser
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
