version: 2
# Batch routine updates monthly. Security updates keep their independent schedule.
updates:
  - package-ecosystem: npm
    directory: /frontend
    groups:
      next-runtime:
        applies-to: version-updates
        patterns:
          - next
          - eslint-config-next
        update-types:
          - minor
          - patch
      react-runtime:
        applies-to: version-updates
        patterns:
          - react
          - react-dom
        update-types:
          - minor
          - patch
      frontend-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - next
          - eslint-config-next
          - react
          - react-dom
        update-types:
          - minor
          - patch
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: /backend
    groups:
      backend-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  - package-ecosystem: pip
    directory: /doc-parser
    groups:
      parser-maintenance:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
