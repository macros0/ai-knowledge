# Минимальный контур регрессии: клонировать, поставить, собрать, прогнать.
# Ubuntu — намеренно: часть дефектов (разделители путей, чувствительность к
# регистру, отсутствие .env) видна только вне рабочей Windows/macOS-машины.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI only checks out code and builds/tests it; no job needs write access to the
# repository or other GitHub resources. Keep the token read-only even if the
# repository-level default permissions are changed later.
permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон — очередь не копится.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: |
          # doc-parser ставится из исходников: backend импортирует его как пакет
          # (docparser), а на PyPI его нет.
          pip install -e ./doc-parser
          pip install -r backend/requirements.txt

      - name: Линт (ruff)
        working-directory: backend
        # Набор правил — в backend/pyproject.toml, а не здесь: локальный
        # `ruff check` обязан совпадать с гейтом.
        run: |
          pip install ruff
          ruff check .

      - name: Тесты + покрытие
        working-directory: backend
        # Без .env и без внешних сервисов: тесты обязаны быть герметичными
        # (SQLite во временном каталоге, Qdrant/LLM замоканы).
        # Порог — чуть ниже текущего значения: гейт ловит крупный непокрытый
        # кусок, а не колеблется на единицах строк.
        run: |
          pip install pytest-cov
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  audit:
    name: зависимости (известные уязвимости)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Оба аудита сейчас чисты, поэтому блокирующие. Новая уязвимость должна
      # приходить как красный CI, а не обнаруживаться на проде.
      - name: pip-audit (backend)
        run: |
          # doc-parser — локальный editable-пакет; его зависимости (включая
          # pypdf) отсутствуют в backend/requirements.txt и иначе выпадают из
          # аудита production runtime.
          pip install -e ./doc-parser
          pip install pip-audit
          pip-audit --local --progress-spinner off

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Bandit (Python security)
        run: |
          pip install bandit
          bandit -q -r backend/app doc-parser/src -ll

  doc-parser:
    name: doc-parser (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc-parser/pyproject.toml

      # Тестовые PDF пишутся кириллицей, а встроенная в reportlab Vera её не
      # содержит: без системного шрифта два теста извлечения текста уходят в
      # skip (на macOS они проходят за счёт системного Arial — расхождение
      # видно только на Linux).
      - name: Шрифт с кириллицей для генерации тестовых PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Установка зависимостей
        working-directory: doc-parser
        run: pip install -e ".[dev]"

      - name: Тесты
        working-directory: doc-parser
        run: python -m pytest -q

  frontend:
    name: frontend (тесты + сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что в frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Именно ci, а не install: проверяет, что package-lock.json не разъехался
      # с package.json — образ фронтенда собирается этой же командой.
      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Линт (eslint)
        working-directory: frontend
        # Правила — в frontend/eslint.config.mjs. Три правила react-hooks там
        # понижены до warning: они срабатывают на коде, написанном до линтера,
        # и правятся отдельным проходом (см. комментарий в конфиге).
        run: npm run lint

      - name: Тесты
        working-directory: frontend
        run: npm test

      - name: Сборка
        working-directory: frontend
        run: npm run build

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    env:
      OKF_RUNTIME_ENV_FILE: .env
    steps:
      - uses: actions/checkout@v4

      # CI deliberately creates its own named runtime file. Explicit
      # --env-file plus OKF_RUNTIME_ENV_FILE proves that a developer .env is
      # never an implicit source for production-like compose invocations.
      - name: .env из .env.example
        run: |
          cp .env.example .env
          # CI runs the bundled topology explicitly. Runtime env_file is .env
          # only because this job created it; production must name its own file.
          cat >> .env <<'EOF'
          STORAGE_MODE=bundled
          COMPOSE_PROFILES=bundled
          COMPOSE_PROJECT_NAME=okf-ci-bundled
          POSTGRES_PASSWORD=okf_ci_pg_password
          DATABASE_URL=postgresql+psycopg://okf:okf_ci_pg_password@postgres:5432/okf_knowledge
          QDRANT_URL=http://qdrant:6333
          EMBEDDING_PROVIDER=fake
          LLM_BASE_URL=http://llm-health:8000
          LLM_MODEL=fake
          EOF
          cp .env .ci-bundled.env

      - name: Проверка конфигурации compose
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml config --quiet

      - name: Сборка образов
        run: |
          docker compose --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml build

      - name: Standard image uses PDFium and contains no MuPDF artifacts
        run: |
          docker compose --env-file .env run --rm --no-deps backend python -c "import importlib.metadata as m, importlib.util; assert m.version('pypdfium2'); assert importlib.util.find_spec('pymupdf') is None; assert importlib.util.find_spec('fitz') is None"
          sh scripts/production/audit-standard-image.sh okf-backend:local
          docker compose --env-file .env run --rm --no-deps backend sh -ceu 'python scripts/generate_sbom.py --output /tmp/backend-sbom.json; ! grep -Eiq "pymupdf|mupdf|fitz" /tmp/backend-sbom.json'

      - name: MIT declarations and third-party notices
        run: |
          test "$(head -n 1 LICENSE)" = "MIT License"
          ! git grep -n -E "SPDX-License-Identifier: AGPL-3.0-or-later|GNU AFFERO" -- backend doc-parser README.md README.ru.md README.de.md README.es.md frontend/package.json LICENSE
          git grep -q "pypdfium2" -- THIRD_PARTY_NOTICES.md
          git grep -q "PDFium" -- THIRD_PARTY_NOTICES.md
          docker compose --env-file .env run --rm --no-deps backend test -s /app/THIRD_PARTY_NOTICES.md

      - name: Bundled migration and JSON-ready backend
        run: |
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml \
            up -d --wait postgres qdrant llm-health
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml run --rm --no-deps migrate
          # The migration path must remain idempotent.
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml run --rm --no-deps migrate
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml run --rm --no-deps migrate alembic check
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml run --rm --no-deps migrate python scripts/seed_attribute_values.py
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml up -d backend
          for attempt in $(seq 1 30); do
            if docker compose --project-name okf-ci-bundled --env-file .env \
              -f docker-compose.yml -f docker-compose.ci-runtime.yml exec -T backend \
              python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5))["status"] == "ok"'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose --project-name okf-ci-bundled --env-file .env \
                -f docker-compose.yml -f docker-compose.ci-runtime.yml logs backend
              exit 1
            fi
            sleep 2
          done
          if docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml ps --format json | grep -Eq '"PublishedPort":[1-9]'; then
            echo 'bundled database or backend unexpectedly published a host port' >&2
            exit 1
          fi

      - name: External topology boots without bundled storage
        env:
          OKF_RUNTIME_ENV_FILE: .ci-external.env
        run: |
          cat > .ci-external.env <<'EOF'
          OKF_RUNTIME_ENV_FILE=.ci-external.env
          STORAGE_MODE=external
          DATABASE_URL=postgresql+psycopg://okf:okf_ci_external_password@postgres-external:5432/okf_knowledge
          QDRANT_URL=http://qdrant-external:6333
          QDRANT_COLLECTION=okf_knowledge_base
          ENVIRONMENT=development
          AUTH_PROVIDER=disabled
          EMBEDDING_PROVIDER=fake
          LLM_BASE_URL=http://llm-health:8000
          LLM_MODEL=fake
          EOF
          # This root .env intentionally describes an invalid bundled topology.
          # The explicit external env file below must fully override it.
          cat > .env <<'EOF'
          STORAGE_MODE=bundled
          DATABASE_URL=postgresql+psycopg://wrong:wrong@postgres:5432/wrong
          QDRANT_URL=http://qdrant:6333
          EOF
          if docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml \
            config --services | grep -xE 'postgres|qdrant'; then
            echo 'external configuration leaked bundled storage services' >&2
            exit 1
          fi
          docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml config --quiet
          docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml \
            up -d --wait postgres-external qdrant-external llm-health
          docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml \
            run --rm --no-deps migrate
          docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml up -d backend
          for attempt in $(seq 1 30); do
            if docker compose --project-name okf-ci-external --env-file .ci-external.env \
              -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
              -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml exec -T backend \
              python -c 'import json, urllib.request; assert json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5))["status"] == "ok"'; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose --project-name okf-ci-external --env-file .ci-external.env \
                -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
                -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml logs backend
              exit 1
            fi
            sleep 2
          done

      - name: Invalid mixed storage mode is rejected before migration
        env:
          OKF_RUNTIME_ENV_FILE: .ci-invalid.env
        run: |
          cat > .ci-invalid.env <<'EOF'
          OKF_RUNTIME_ENV_FILE=.ci-invalid.env
          STORAGE_MODE=external
          DATABASE_URL=postgresql+psycopg://okf:password@postgres:5432/okf_knowledge
          QDRANT_URL=http://qdrant:6333
          QDRANT_COLLECTION=okf_knowledge_base
          ENVIRONMENT=development
          AUTH_PROVIDER=disabled
          EMBEDDING_PROVIDER=fake
          EOF
          if docker compose --project-name okf-ci-invalid --env-file .ci-invalid.env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml \
            run --rm --no-deps migrate python scripts/validate_storage_mode.py; then
            echo 'mixed external topology unexpectedly passed validation' >&2
            exit 1
          fi

      - name: Backup and restore shell safety suite
        run: bash scripts/production/tests/test_backup_scripts.sh

      - name: Nonempty bundled backup restores into a fresh project
        run: |
          docker compose --project-name okf-ci-bundled --env-file .env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml \
            run --rm --no-deps backend python scripts/seed_backup_fixture.py --confirm-ci-fixture
          rm -rf .ci-backup .ci-restored-data
          bash scripts/production/backup-bundled.sh --env-file .ci-bundled.env --backup-dir "$PWD/.ci-backup"
          backup_dir=$(find "$PWD/.ci-backup" -mindepth 1 -maxdepth 1 -type d -name 'backup-*' -print -quit)
          test -n "$backup_dir"
          BACKUP_DIR="$backup_dir" python -c 'import json, os, pathlib; m=json.loads((pathlib.Path(os.environ["BACKUP_DIR"]) / "manifest.json").read_text()); assert m["totals"] == {"documents": 1, "chunks": 1, "concepts": 1, "qdrant_points": 2}; assert len(m["files"]) == 2; assert m["schema_revision"]; assert m["pdf_provider"]["provider"] == "pypdf-pdfium"'
          bash scripts/production/restore-bundled.sh --env-file .ci-bundled.env --backup-dir "$backup_dir" \
            --target-project okf-ci-restored --target-data-dir "$PWD/.ci-restored-data"

      # Release-candidate manual acceptance (not a CI substitute): reboot the
      # staging host; confirm the systemd unit starts the selected topology and
      # backend /health is JSON-ready; record corpus totals; back up a nonempty
      # corpus; restore into a new --target-project/--target-data-dir; compare
      # manifest totals and run check_integrity.py --strict.
      - name: Остановить bundled CI services
        if: always()
        run: |
          docker compose --project-name okf-ci-bundled --env-file .ci-bundled.env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml down -v --remove-orphans

      - name: Остановить external CI services
        if: always()
        run: |
          test -f .ci-external.env || exit 0
          docker compose --project-name okf-ci-external --env-file .ci-external.env \
            -f docker-compose.yml -f deploy/production/docker-compose.external.yml \
            -f docker-compose.ci-runtime.yml -f docker-compose.ci-external.yml down -v --remove-orphans

      - name: Остановить restored CI services
        if: always()
        run: |
          docker compose --project-name okf-ci-restored --env-file .ci-bundled.env \
            -f docker-compose.yml -f docker-compose.ci-runtime.yml down -v --remove-orphans
