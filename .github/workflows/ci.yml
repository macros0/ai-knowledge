# Минимальный контур регрессии: клонировать, поставить, собрать, прогнать.
# Ubuntu — намеренно: часть дефектов (разделители путей, чувствительность к
# регистру, отсутствие .env) видна только вне рабочей Windows/macOS-машины.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон — очередь не копится.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Та же версия, что в backend/Dockerfile.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Установка зависимостей
        run: |
          # doc-parser ставится из исходников: backend импортирует его как пакет
          # (docparser), а на PyPI его нет.
          pip install -e ./doc-parser
          pip install -r backend/requirements.txt

      - name: Линт (ruff)
        working-directory: backend
        # Набор правил — в backend/pyproject.toml, а не здесь: локальный
        # `ruff check` обязан совпадать с гейтом.
        run: |
          pip install ruff
          ruff check .

      - name: Тесты + покрытие
        working-directory: backend
        # Без .env и без внешних сервисов: тесты обязаны быть герметичными
        # (SQLite во временном каталоге, Qdrant/LLM замоканы).
        # Порог — чуть ниже текущего значения: гейт ловит крупный непокрытый
        # кусок, а не колеблется на единицах строк.
        run: |
          pip install pytest-cov
          python -m pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85

  audit:
    name: зависимости (известные уязвимости)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Оба аудита сейчас чисты, поэтому блокирующие. Новая уязвимость должна
      # приходить как красный CI, а не обнаруживаться на проде.
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off

      - name: npm audit (frontend)
        working-directory: frontend
        run: npm audit --audit-level=high

  doc-parser:
    name: doc-parser (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: doc-parser/pyproject.toml

      # Тестовые PDF пишутся кириллицей, а встроенная в reportlab Vera её не
      # содержит: без системного шрифта два теста извлечения текста уходят в
      # skip (на macOS они проходят за счёт системного Arial — расхождение
      # видно только на Linux).
      - name: Шрифт с кириллицей для генерации тестовых PDF
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Установка зависимостей
        working-directory: doc-parser
        run: pip install -e ".[dev]"

      - name: Тесты
        working-directory: doc-parser
        run: python -m pytest -q

  frontend:
    name: frontend (тесты + сборка)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Та же мажорная версия, что в frontend/Dockerfile.
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Именно ci, а не install: проверяет, что package-lock.json не разъехался
      # с package.json — образ фронтенда собирается этой же командой.
      - name: npm ci
        working-directory: frontend
        run: npm ci

      - name: Линт (eslint)
        working-directory: frontend
        # Правила — в frontend/eslint.config.mjs. Три правила react-hooks там
        # понижены до warning: они срабатывают на коде, написанном до линтера,
        # и правятся отдельным проходом (см. комментарий в конфиге).
        run: npm run lint

      - name: Тесты
        working-directory: frontend
        run: npm test

      - name: Сборка
        working-directory: frontend
        run: npm run build

  docker:
    name: docker compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Сервисы объявляют env_file: .env, поэтому без него compose не читается.
      # Заодно это проверка самого .env.example: он должен парситься форматом
      # dotenv (многострочные значения ломают и compose, и pydantic-settings).
      - name: .env из .env.example
        run: cp .env.example .env

      - name: Проверка конфигурации compose
        run: docker compose config --quiet

      - name: Сборка образов
        run: docker compose build

      # Сборка образа НЕ доказывает, что в нём есть чем выполнить деплой:
      # без alembic/ и scripts/ образ собирается ровно так же, а обязательные
      # шаги (docs/PRODUCTION_DEPLOYMENT.md §7) выполнить нечем. Поэтому
      # прогоняем миграции внутри собранного образа против compose-Postgres.
      - name: Миграции применяются в собранном образе
        run: |
          # DATABASE_URL из .env.example смотрит на 127.0.0.1 — внутри
          # compose-сети хост называется postgres, пароль берётся из
          # POSTGRES_PASSWORD по умолчанию (docker-compose.yml).
          echo "DATABASE_URL=postgresql+psycopg://postgres:okf_dev_pg@postgres:5432/okf_knowledge" >> .env
          docker compose --profile local-postgres up -d postgres
          docker compose --profile local-postgres run --rm migrate
          # Повторный прогон обязан быть no-op: миграции идемпотентны.
          docker compose --profile local-postgres run --rm migrate

      # Схема из миграций обязана совпасть с моделями. Именно этой проверки не
      # хватало, когда documents.problem и шесть NOT NULL-колонок разъехались:
      # миграции накатывались, но никто не сверял результат с models.py.
      # Здесь, а не в pytest-джобе: против НАСТОЯЩЕГО Postgres. На SQLite
      # `alembic check` даёт ложный add_fk (диалект не отражает внешние ключи),
      # поэтому герметичный тест tests/test_schema_drift.py сверяет только
      # диалект-независимые расхождения, а полную сверку делаем здесь.
      - name: Схема миграций совпадает с моделями (alembic check)
        run: docker compose --profile local-postgres run --rm migrate alembic check

      - name: Скрипты предзаполнения доступны в образе
        run: docker compose --profile local-postgres run --rm migrate python scripts/seed_attribute_values.py

      - name: Остановить сервисы
        if: always()
        run: docker compose --profile local-postgres down -v
