services:
  # The deployment CI validates storage, parser and migration readiness without
  # spending tokens at a real LLM provider. health.py only needs GET /models to
  # be reachable; this tiny in-network responder supplies that contract.
  llm-health:
    image: okf-backend:local
    entrypoint: ["python", "-c"]
    command:
      - |
        from http.server import BaseHTTPRequestHandler, HTTPServer
        class Handler(BaseHTTPRequestHandler):
            def do_GET(self):
                self.send_response(200)
                self.send_header("Content-Type", "application/json")
                self.end_headers()
                self.wfile.write(b'{"data": []}')
            def log_message(self, format, *args):
                pass
        HTTPServer(("0.0.0.0", 8000), Handler).serve_forever()
    networks: [app_network]
