# Конфигурация линтера. Отдельный файл, а не аргументы в CI: локальный `ruff
# check` и гейт в CI обязаны видеть один и тот же набор правил.
[tool.ruff]
line-length = 100
extend-exclude = ["alembic/versions"]
cache-dir = "../tests/tmp/ruff-cache"

[tool.ruff.lint]
# Осознанно узкий набор — правила, ловящие дефекты, а не стиль:
#   E9  — синтаксис и то, что упадёт в рантайме;
#   F   — pyflakes: неопределённые имена, мёртвые импорты и переменные,
#         сломанные f-строки, повторные определения.
# Гейт должен быть зелёным и осмысленным с первого дня: наборы вроде B/UP/SIM
# дают сотни находок стиля, среди которых настоящий дефект незаметен. Расширять
# по одному правилу за раз, каждый раз приводя код в порядок.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Реэкспорт кодов ошибок как errors.XXX — импорт «неиспользован» по букве правила.
"app/api/errors.py" = ["F403", "F405"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Все временные данные pytest должны жить в общей папке тестовых артефактов.
# -p no:cacheprovider не даёт создавать .pytest_cache в корне backend.
addopts = "--basetemp=../tests/tmp/pytest-runs/backend -p no:cacheprovider"
cache_dir = "../tests/tmp/pytest-runs/backend-cache"
