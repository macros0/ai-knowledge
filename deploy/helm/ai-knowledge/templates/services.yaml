{{- range $name, $port := dict "frontend" 3000 "backend" 8000 "postgres" 5432 "qdrant" 6333 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "okf.labels" $ | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    okf-role: {{ if and (eq $name "frontend") (eq $.Values.deployment.mode "frontend-split") }}frontend{{ else }}{{ ternary "application" $name (has $name (list "frontend" "backend")) }}{{ end }}
  ports: [{name: http, port: {{ $port }}, targetPort: {{ $port }}}]
{{- end }}
