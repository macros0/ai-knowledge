{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: application-boundaries}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
    matchExpressions:
      - {key: okf-role, operator: NotIn, values: [model-stub]}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: {{ .Values.gateway.namespace | quote }}}
      ports: [{protocol: TCP, port: 3000}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}}]
    - to: [{namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}}]
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- with .Values.networkPolicy.externalEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: stub-no-egress}
spec:
  podSelector: {matchLabels: {okf-role: model-stub}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress: []
{{- end }}
