[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okf-doc-parser"
version = "0.1.0"
description = "Standalone extraction of DOCX (with reviewer comments and embedded objects), XLSX and PDF into structured blocks / markdown."
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pypdf[image]>=6.16.1",
    "defusedxml>=0.7.1",
    "olefile>=0.47",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "reportlab>=4.0",
]

[project.scripts]
doc-parser = "docparser.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Не создавать временные каталоги и pytest-кэш рядом с исходниками.
addopts = "--basetemp=../tests/tmp/pytest-runs/doc-parser -p no:cacheprovider"
cache_dir = "../tests/tmp/pytest-runs/doc-parser-cache"
