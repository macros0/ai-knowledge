services:
  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: okf-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: okf-backend
    env_file:
      - .env
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATA_DIR=/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    depends_on:
      - qdrant
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: okf-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
