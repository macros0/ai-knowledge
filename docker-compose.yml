services:
  postgres:
    image: postgres:17
    container_name: okf-postgres
    # Опциональный сервис: поднимается только при явном включении профиля
    #   docker compose --profile local-postgres up
    # В остальных случаях backend подключается к внешнему Postgres по DATABASE_URL
    # из .env (например, корпоративный). Инициализация кластера — UTF8 по умолчанию.
    profiles: ["local-postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okf_dev_pg}
      POSTGRES_DB: okf_knowledge
    # Порт наружу НЕ публикуется: Postgres нужен только backend'у внутри сети.
    # Если нужен прямой доступ с localhost (psql/DBeaver) — раскомментируйте:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okf_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: okf-qdrant
    # Опциональный сервис: поднимается только при явном включении профиля
    #   docker compose --profile local-qdrant up
    # В остальных случаях backend подключается к внешнему Qdrant по QDRANT_URL
    # из .env (например, корпоративный https://qdrant.corp.internal:6333).
    profiles: ["local-qdrant"]
    # Порт наружу НЕ публикуется: Qdrant нужен только backend'у внутри сети.
    # Если нужен прямой доступ с localhost (curl/дашборд) — раскомментируйте:
    # ports:
    #   - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: okf-backend
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
    # QDRANT_URL приходит только из .env (через env_file) — backend не различает
    # локальный (http://qdrant:6333, профиль local-qdrant) и корпоративный
    # (https://qdrant.corp.internal:6333) Qdrant. Аналогично DATABASE_URL указывает
    # на Postgres (внутренний postgres:5432 при профиле local-postgres, либо внешний).
    # Порт наружу НЕ публикуется: доступ к backend'у только через frontend
    # (Next.js rewrites серверно проксируют /api). Единственная публичная
    # точка — frontend ниже.
    volumes:
      - ./data:/data
    depends_on:
      qdrant:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: okf-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
