services:
  postgres:
    image: postgres:17
    container_name: okf-postgres
    # Опциональный сервис: поднимается только при явном включении профиля
    #   docker compose --profile local-postgres up
    # В остальных случаях backend подключается к внешнему Postgres по DATABASE_URL
    # из .env (например, корпоративный). Инициализация кластера — UTF8 по умолчанию.
    profiles: ["local-postgres"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okf_dev_pg}
      POSTGRES_DB: okf_knowledge
    # Порт наружу НЕ публикуется: Postgres нужен только backend'у внутри сети.
    # Если нужен прямой доступ с localhost (psql/DBeaver) — раскомментируйте:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d okf_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: okf-qdrant
    # Опциональный сервис: поднимается только при явном включении профиля
    #   docker compose --profile local-qdrant up
    # В остальных случаях backend подключается к внешнему Qdrant по QDRANT_URL
    # из .env (например, корпоративный https://qdrant.corp.internal:6333).
    profiles: ["local-qdrant"]
    # Порт наружу НЕ публикуется: Qdrant нужен только backend'у внутри сети.
    # Если нужен прямой доступ с localhost (curl/дашборд) — раскомментируйте:
    # ports:
    #   - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  # Одноразовая миграция схемы. Отдельный сервис, а не шаг в CMD бэкенда:
  # backend перезапускается, а `alembic upgrade head` должен
  # выполниться ровно один раз и ДО старта приложения — в production init_db()
  # намеренно не вызывается (схему ведёт Alembic), поэтому без миграций
  # контейнер поднимется на пустой БД и будет отдавать ошибки.
  # Сид справочников (docs/PRODUCTION_DEPLOYMENT.md §7.2) автоматически НЕ
  # выполняется — он клиент-специфичен (--org). Запускать вручную тем же образом:
  #   docker compose run --rm migrate python scripts/seed_attribute_values.py
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      # UID/GID непривилегированного пользователя в образе. Должны совпадать с
      # владельцем ./data на хосте — иначе бинд-маунт /data будет недоступен на
      # запись: docker compose build --build-arg APP_UID=$(id -u) ... либо
      # APP_UID/APP_GID в .env.
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    # Свой тег, хотя образ тот же, что у backend: две службы с ОДНИМ image
    # означают две цели сборки с одинаковым выходным тегом, а сборщики с bake
    # такое отвергают. Контекст и Dockerfile совпадают, поэтому вторая сборка
    # берётся из кеша слоёв и ничего не стоит.
    container_name: okf-migrate
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
    volumes:
      - ./data:/data
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    # Разовая задача: перезапускать после успешного выхода не нужно.
    restart: "no"

  # Ровно один процесс: очередь задач, rate limit, потоки пайплайна и
  # purge-циклы живут в памяти, а `recover_after_restart()` на старте помечает
  # чужие running-задачи failed. Вторая реплика (или uvicorn --workers N) не
  # просто не увидит это состояние — она оборвёт работу первой.
  # Полный список последствий: docs/PRODUCTION_DEPLOYMENT.md §3.3.
  backend:
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: backend/Dockerfile
      # UID/GID непривилегированного пользователя в образе. Должны совпадать с
      # владельцем ./data на хосте — иначе бинд-маунт /data будет недоступен на
      # запись: docker compose build --build-arg APP_UID=$(id -u) ... либо
      # APP_UID/APP_GID в .env.
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: okf-backend:local
    container_name: okf-backend
    env_file:
      - .env
    environment:
      - DATA_DIR=/data
      - ENVIRONMENT=${ENVIRONMENT:-production}
    # QDRANT_URL приходит только из .env (через env_file) — backend не различает
    # локальный (http://qdrant:6333, профиль local-qdrant) и корпоративный
    # (https://qdrant.corp.internal:6333) Qdrant. Аналогично DATABASE_URL указывает
    # на Postgres (внутренний postgres:5432 при профиле local-postgres, либо внешний).
    # Порт наружу НЕ публикуется: доступ к backend'у только через frontend
    # (Next.js rewrites серверно проксируют /api). Единственная публичная
    # точка — frontend ниже.
    volumes:
      - ./data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
        required: false
      postgres:
        condition: service_healthy
        required: false
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: okf-frontend
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "8080:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  qdrant_data:
  postgres_data:
