services:
  # Bundled storage is an all-or-nothing production profile. Neither service
  # has a host port: only containers on storage_network can reach them.
  postgres:
    image: postgres:17@sha256:67f41722b7a8cbdb868a44a4995c846eddfdc2973bccb291ce937dce88ad5675
    profiles: ["bundled"]
    environment:
      POSTGRES_USER: okf
      # Empty is accepted by `config` for the external profile; the official
      # Postgres image refuses to initialize without it, while the migration
      # preflight gives the topology-specific error before Alembic runs.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: okf_knowledge
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [storage_network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okf -d okf_knowledge"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles: ["bundled"]
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [storage_network]
    restart: unless-stopped

  # Schema migration is a one-shot gate. Validation and the read-only Qdrant
  # wait run before Alembic so a mixed topology cannot touch either database.
  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: okf-migrate:local
    env_file:
      - ${OKF_RUNTIME_ENV_FILE:?set OKF_RUNTIME_ENV_FILE to the selected runtime env file}
    environment:
      DATA_DIR: /data
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ${OKF_DATA_DIR:-./data}:/data
    networks: [storage_network]
    command:
      - sh
      - -ceu
      - >-
        python scripts/validate_storage_mode.py &&
        python scripts/wait_for_qdrant.py --url "$$QDRANT_URL" --timeout-seconds 60 &&
        alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      qdrant:
        condition: service_started
        required: false
    restart: "no"

  # A single backend process is required: queues and recovery state are local.
  # In external mode app_network provides egress to customer-owned storage;
  # bundled storage remains confined to the internal network.
  backend:
    deploy:
      replicas: 1
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        APP_UID: ${APP_UID:-1000}
        APP_GID: ${APP_GID:-1000}
    image: okf-backend:local
    env_file:
      - ${OKF_RUNTIME_ENV_FILE:?set OKF_RUNTIME_ENV_FILE to the selected runtime env file}
    environment:
      DATA_DIR: /data
      ENVIRONMENT: ${ENVIRONMENT:-production}
    volumes:
      - ${OKF_DATA_DIR:-./data}:/data
    networks: [app_network, storage_network]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python -c 'import json, urllib.request; health = json.load(urllib.request.urlopen("http://127.0.0.1:8000/health", timeout=5)); assert health["status"] == "ok"'
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "${FRONTEND_PORT:-8080}:3000"
    networks: [app_network]
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  app_network: {}
  storage_network:
    internal: true

volumes:
  qdrant_data:
  postgres_data:
